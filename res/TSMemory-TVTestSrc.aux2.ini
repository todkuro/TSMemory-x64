; TSMemory-TVTestSrc (AviUtl ExEdit2 汎用プラグイン) の設定
;
; このファイルは TSMemory-TVTestSrc.aux2 と同じフォルダに
; TSMemory-TVTestSrc.ini という名前で置いてください。
; (設定ファイルの名前はプラグイン本体の名前に合わせる必要があります)
;
; ここに書かれていない設定については docs/development.md の「隠し設定」を参照してください。

;----------------------------------------------------------------------------
; TVTest との連携
;----------------------------------------------------------------------------
[Bridge]

; 読み込んだ映像を配置するレイヤー番号 (1 起点)
Layer=1

; 読み込んだ映像を配置するフレーム番号 (1 起点)
Frame=1

; 読み込み時に AviUtl2 のウィンドウを手前に出すか (0/1)
Activate=1

; 取り込んだ後のシーク位置 (0=先頭 / 1=末尾)
;
; TVTest から渡されるのは「コマンドを実行した時点まで」の映像なので、
; 末尾が目的の場面になっている事が多く、1 にすると探す手間が減ります。
; TVTest側iniのMemorySizeを大きくしたときに特に効果あり。
SeekToEnd=0

; 取り込んだ後に配置先レイヤーをロックするか (0/1)
;
; プレビュー画面でドラッグしてオブジェクトを動かしてしまう事故を防ぎます。
; 次の取り込みの際には自動で解除して置き直すので、操作は要りません。
;
; ※ このオプションが 0 の間は、手で掛けたロックを勝手に外す事はしません。
;    その場合ロックされたレイヤーには配置出来ないので、手で解除してください。
LockLayer=0

; 読み込んだ映像に適用するフィルタのプリセット名
;
; AviUtl2 は 1.xx 版と違い、各フィルタの初期値をあらかじめ設定しておく事が
; 出来ません。インターレース解除やノイズ除去などのテレビ向けの設定を
; 「フィルタのプリセット」として保存しておき、その名前をここに書くと
; 取り込んだ映像に自動で適用されます。
;
; プリセットは AviUtl2 の設定ウィンドウのメニューから作成でき、
;   %ProgramData%\aviutl2\Preset\動画ファイル.<プリセット名>.preset
; に保存されます。ここには「<プリセット名>」の部分だけを書いてください。
;
; 例) Preset=キャプチャ用フィルタ
;
; 空欄の場合は何もしません (既定)。
Preset=

; 終了時の「現在の編集データは更新されています」に自動で応答するか (0/1/2)
;
; TSMemory がタイムラインにオブジェクトを置くと編集済み扱いになり、
; AviUtl2 の終了時に保存の確認が出ます。キャプチャを見るだけの用途では
; 煩わしい為、自動で「いいえ」(保存しない) と応答する事が出来ます。
;
;   0 … 何もしない (既定)
;   1 … TSMemory が配置しただけの状態に限って応答します。
;        その後にオブジェクトの更新が検出された場合は応答しません
;        (手で編集した内容は捨てません)。
;   2 … TSMemory が取り込んだ後であれば、編集していても応答します。
;        ※ 編集内容は確認無しで破棄されます。
;           トリミングや色調整をしてから画像を保存する、といった
;           「保存する必要が無い編集」を毎回する場合向けです。
;           プロジェクトを保存して続きをやる使い方には向きません。
;
; ※ どの値でも、TSMemory が一度も取り込んでいない場合は応答しません。
;    TSMemory と無関係に開いたプロジェクトを壊す事はありません。
; ※ AviUtl2 には編集済みフラグを解除する API が無い為、確認ダイアログを
;    検出して応答するという本体の動作に割り込む方法になります。
;    その為、既定では無効にしてあります。
SuppressExitConfirm=0

;----------------------------------------------------------------------------
; キャプチャ・ユーティリティ
;----------------------------------------------------------------------------
[Capture]

; 保存先のファイル名 (拡張子を省略すると形式に応じて付加されます)
; 空欄の場合は「ピクチャ」フォルダの Capture が使われます。
FileName=

; 保存形式 (png / jpeg / bmp / tiff)
Format=png

; JPEG の品質 (1-100)
JpegQuality=90

; 保存時にファイル名をクリップボードにコピーするか (0/1)
CopyFileName=0

;----------------------------------------------------------------------------
; MPEG-2 デコーダ (m2v) の設定
;----------------------------------------------------------------------------
[M2V]

; 読み込みを諦めるまでの時間 (秒)
;
; 壊れた MPEG-2 を渡されると、デコーダの解析が現実的な時間で終わらなく
; なる事があります。そのまま待つと AviUtl2 が固まる為、時間を区切って
; 「読み込めなかった」事にします。
;
; 0 にすると待ち続けます (従来の挙動)。上限は 600 秒です。
open_timeout=10

; 音声も扱うか (0/1)
;
; TVTest 側の TSMemory.ini で
;   [Settings]
;   Audio=1
; も併せて設定してください。両方が 1 でないと音声は出ません。
;
; 0 の間は音声デコーダを開かないので、音声を探す処理も走りません。
;
; 音声は AAC を Windows 標準の Media Foundation で復号します
; (追加の DLL は要りません)。映像との時間差は PTS を見て詰めます。
;
; ※ 取り込んだ分の音声を開いた時にまとめて復号してメモリに置きます。
;    48kHz ステレオでおよそ 1 分あたり 11MB です。
;    確保量は取り込んだ長さから決まるので、MemorySize を大きくしても
;    音声だけ途中で切れる事はありません。
; ※ 静止画キャプチャが主な用途な為、既定は映像のみにしてあります。
audio=0

; アスペクト比を反映してリサイズするか (0=しない / 1=する)
;
; シークが重い場合は 0 にして AviUtl2 側で拡大すると軽くなる可能性があります。
aspect_ratio=1

;----------------------------------------------------------------------------
; 字幕 (ARIB STD-B24)
;----------------------------------------------------------------------------
; 字幕を取り込んでタイムラインに置きます。既定は無効です。
;
; ※ TVTest 側の TSMemory.ini でも [Settings] Subtitle=1 が必要です
;    (字幕の PID を溜め込む必要がある為)。
;
; 字幕は AviUtl2 の**テキストオブジェクト**として置かれるので、
; 取り込んだ後で文字を直せます。焼き込みではありません。
[Caption]

; 字幕を取り込むか (0/1)
Enable=0

; 配置先のレイヤー番号。
;
; **必ず映像 ([Bridge] Layer) とは別のレイヤーにしてください。**
; 同じにすると、字幕を置く前の掃除で映像のオブジェクトごと消えてしまう為、
; 同じ番号だった場合は字幕を置かずにログへ警告を出します。
;
; [Bridge] LockLayer=1 の時は、映像と同じようにこのレイヤーも配置後に
; ロックします (次の取り込みでは自分で外すので、掛けたままで構いません)。
; 手でロックしていた場合は勝手に外さず、字幕を置かずに警告を出します。
Layer=2

; 本文の先頭に入れるテキストプリセットの名前。
;
; **書体を変えたい時はここで指定したプリセットを 1 つ直すだけで、
;   全ての字幕に効きます。**タイムライン上で 1 つずつ触る必要はありません。
; AviUtl2 側でテキストオブジェクトの設定 (フォント・文字装飾・縁取り等) を
; プリセットとして保存し、その名前をここに書いてください。
; 空にすると AviUtl2 の既定のままになります。
Preset=

; 放送で指定された文字色を使うか (0/1)。
; 0 にすると色を出さないので、上の Preset 側の色がそのまま使われます。
UseBroadcastColor=1

; 放送で指定された背景色を影・縁色として使うか (0/1)。
;
; AviUtl2 のテキストには「背景の箱」がありません。制御文字で指定できる
; 2 つ目の色は影・縁色なので、Preset 側で文字装飾を「縁取り文字」に
; しておかないと見えません。
;
; ※ 実際の放送では、背景色が ARIB の拡張パレット (色配列 1 以上) で
;    指定されている事が多く、その 112 色は未実装の為に色を出しません。
;    現状ではほとんどの番組で効きません。
UseBackColor=1

; 外字 (DRCS) 用のフォント名。
;
; 外字は字形のビットマップが放送に乗って来ます。それを取り込みの度に
; フォントへ組み立てて AviUtl2 に登録するので、**放送どおりの字形が
; テキストのまま表示されます**。インストールは不要です。
; 本文の書体は上の Preset のまま保たれ、外字の 1 文字だけ切り替わります。
DrcsFont=TSMemory DRCS

; 放送の文字の大きさに合わせるか (0/1)
;
; 字幕は「字幕平面の中で何ドット角か」で指定されて来ます
; (例: 960x540 の平面で 36 ドット角)。出力の高さと合わせて AviUtl2 の
; サイズに直します。1080p なら 36 * 1080 / 540 = 72 になります。
;
; ※ 1 にすると絶対値でサイズを出す為、Preset 側のサイズは効きません。
UseBroadcastSize=0

; 放送の表示位置に合わせるか (0/1)
;
; 字幕は 960x540 等の「字幕平面」の中の座標で送られて来ます。それを
; 出力の解像度へ割り直し、画面中央からのずれとしてオブジェクトの
; X / Y に設定します。
;
; ※ テキストオブジェクトの「配置」が「左寄せ[上]」である前提です。
;    プリセットで配置を変えている場合はずれます。
; ※ 1 つの字幕の中で行ごとに位置が違う場合は、一番左・一番上に揃えます。
UsePosition=1

; 位置の微調整 (ピクセル)。上の UsePosition が 1 の時だけ効きます。
OffsetX=0
OffsetY=0

; 字幕の背景 (半透明の箱) の不透明度 (0-100)。0 で背景なし
;
; 放送の字幕には半透明の黒い箱が敷かれています (ARIB の色表で
; 索引 65 = 黒・アルファ 128)。既定の 50 はその値に合わせたものです。
;
; 箱は図形オブジェクトではなく、テキストに貼るスクリプト
; 「TSMemory字幕背景」で描きます。**描画後の実寸を見て敷く**ので、
; 後からフォントや文字サイズ・文言を変えても箱が付いて来ます。
;
; ※ スクリプトが Script フォルダに入っていないと背景は付きません
;    (字幕自体は出ます)。パッケージで入れた場合は同梱されています。
; ※ スクリプトの項目 (不透明度・余白・デバッグ表示) は、取り込みの度に
;    ここの値で入れ直します。オブジェクト設定で変えた分は次の取り込みで
;    戻ります。恒久的に変えたい場合はこのファイルを直してください。
BackOpacity=50

; 背景に使うスクリプトの名前。通常は変更不要です。
BackScript=TSMemory字幕背景

; 切り分け用。1 にすると、1 件目の字幕オブジェクトの中身をそのまま
; ログに出します (効果名・項目名・値の書式が全部見えます)。
; 位置がずれる等の相談をする時に付けてください。
Debug=0

; 背景の余白 (ピクセル)。文字の外側にどれだけ広げるか
;
; 放送の背景は文字セル (36 ドット角 + 字間 4 / 行間 24) の大きさで、
; 字形より一回り大きくなっています。既定値はそこから決めています。
BackPaddingX=8
BackPaddingY=4

; 背景スクリプトの切り分け用 (0/1)。1 でスクリプト側もログに出します。
BackDebug=0
