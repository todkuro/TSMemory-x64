; TSMemory (TVTest プラグイン) の設定
;
; このファイルは TVTest の Plugins フォルダに TSMemory.ini という名前で
; TSMemory.tvtp と一緒に置いてください。
;
; ここに書かれていない設定については docs/development.md の「隠し設定」を参照してください。

[Settings]

; AviUtl ExEdit2 (aviutl2.exe) のパス
AviUtlPath=C:\Program Files\aviutl2\aviutl2.exe

; 映像を溜め込む共有メモリのサイズ (MB)
;
; 遡れる長さはこのサイズがそのまま上限になります。
; 地上デジタルの 1080i でおおよそ 10MB = 8〜14 秒程度 (映像のビットレート次第)。
; もっと長く遡りたい場合は大きくしてください。その分メモリを消費します。
;
; ※ 作業用のファイルは %ProgramData%\aviutl2\temp に作ります。
;    そこに書けない場合は %AppData%\aviutl2\temp を使います。
; ※ 溜め込みはプラグインを有効にした時点から始まります。
;    有効にした直後にキャプチャすると、その分しか取れません。
; ※ 指定できる上限は 4096 (MB) です。共有メモリの大きさを 32bit で
;    扱っている為で、4097 以上を書いた場合は上限に制限してログに残します。
;    実際に使う分だけ確保されるのではなく、有効にした時点で
;    指定した分がまとめて確保される事に注意してください。
MemorySize=10

; 保持しておくスナップショットの数
;
; 実行の度に別名の共有メモリを作るので、この数だけ過去の読み込み結果が
; AviUtl2 側で有効なまま残ります。古いものから順に破棄されます。
; メモリ消費は MemorySize × この数になります。
SnapshotCount=4

; TVTest の終了時に AviUtl2 も終了させるか (0/1)
AutoClose=0

; 音声も溜め込むか (0/1)
;
; 1 にすると映像に加えて音声 (AAC) の PID も溜め込みます。
; AviUtl2 側の TSMemory-TVTestSrc.ini で
;   [M2V]
;   audio=1
; も併せて設定してください。両方が 1 でないと音声は出ません。
;
; ※ 音声 PID の分だけリングバッファを食います。同じ MemorySize なら
;    遡れる時間がその分短くなります。
; ※ 静止画キャプチャが主な用途な為、既定は映像のみにしてあります。
Audio=0
